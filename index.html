<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CityCare Hospital Registration</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <header>
            <h1>CityCare Hospital</h1>
            <p>Patient Registration Portal</p>
        </header>

        <form id="registrationForm">

            <h2>Personal Information</h2>

            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name"
                       placeholder="Enter your full name"
                       maxlength="50" required>
                <small id="nameError"></small>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email"
                       placeholder="example@email.com"
                       required>
                <small id="emailError"></small>
            </div>

            <div class="form-group">
                <label for="mobile">Mobile Number</label>
                <input type="tel" id="mobile"
                       placeholder="10-digit mobile number"
                       maxlength="10" required>
                <small id="mobileError"></small>
            </div>

            <div class="form-group">
                <label for="dob">Date of Birth</label>
                <input type="date" id="dob" required>
                <small id="dobError"></small>
            </div>

            <div class="form-group">
                <label>Gender</label>

                <div class="radio-group">
                    <label>
                        <input type="radio" name="gender" value="Male">
                        Male
                    </label>

                    <label>
                        <input type="radio" name="gender" value="Female">
                        Female
                    </label>

                    <label>
                        <input type="radio" name="gender" value="Other">
                        Other
                    </label>
                </div>

                <small id="genderError"></small>
            </div>

            <div class="form-group">
                <label for="bloodGroup">Blood Group</label>

                <select id="bloodGroup" required>
                    <option value="">Select blood group</option>
                    <option>A+</option>
                    <option>A-</option>
                    <option>B+</option>
                    <option>B-</option>
                    <option>O+</option>
                    <option>O-</option>
                    <option>AB+</option>
                    <option>AB-</option>
                    <option>Unknown</option>
                </select>

                <small id="bloodError"></small>
            </div>

            <div class="form-group">
                <label for="address">Address</label>

                <textarea id="address"
                          placeholder="Enter your complete address"
                          maxlength="200"
                          required></textarea>

                <small id="addressError"></small>
            </div>

            <h2>Account Information</h2>

            <div class="form-group">
                <label for="password">Password</label>

                <input type="password" id="password"
                       placeholder="Create a password"
                       minlength="8" maxlength="30"
                       required>

                <small id="passwordError"></small>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>

                <input type="password" id="confirmPassword"
                       placeholder="Confirm your password"
                       required>

                <small id="confirmError"></small>
            </div>

            <h2>Emergency Information</h2>

            <div class="form-group">
                <label for="emergencyContact">
                    Emergency Contact Number
                </label>

                <input type="tel" id="emergencyContact"
                       placeholder="10-digit contact number"
                       maxlength="10" required>

                <small id="emergencyError"></small>
            </div>

            <div class="form-group">
                <label for="department">Preferred Department</label>

                <select id="department" required>
                    <option value="">Select department</option>
                    <option>Cardiology</option>
                    <option>Neurology</option>
                    <option>Orthopedics</option>
                    <option>Dermatology</option>
                    <option>General Medicine</option>
                    <option>Pediatrics</option>
                </select>

                <small id="departmentError"></small>
            </div>

            <div class="form-group">
                <label for="document">Upload Medical Document</label>

                <input type="file" id="document"
                       accept=".pdf,.jpg,.jpeg,.png">

                <small id="documentError"></small>
            </div>

            <div class="form-group checkbox-group">
                <label>
                    <input type="checkbox" id="terms">
                    I agree to the terms and conditions.
                </label>

                <small id="termsError"></small>
            </div>

            <button type="submit">Register Patient</button>

            <button type="reset" class="reset-btn">
                Reset Form
            </button>

            <div id="successMessage"></div>

        </form>

    </div>

    <script src="script.js"></script>
</body>
</html>
